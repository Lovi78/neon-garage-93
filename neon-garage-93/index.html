<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10151d" />
    <title>Neon Garage '93</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="pixel.css" />
    <script defer src="js/cars.js"></script>
    <script defer src="js/catalog-v06.js"></script>
    <script defer src="js/sprite-clips.js"></script>
    <script defer src="js/scene.js"></script>
    <script defer src="js/economy.js"></script>
    <script defer src="js/progression.js"></script>
    <script defer src="js/strategy.js"></script>
    <script defer src="js/finance.js"></script>
    <script defer src="js/collection.js"></script>
    <script defer src="js/customers.js"></script>
    <script defer src="js/day-report.js"></script>
    <script defer src="js/negotiation.js"></script>
    <script defer src="js/legacy-language.js"></script>
    <script defer src="js/state.js"></script>
    <script defer src="js/ui.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="details"></dialog>
    <dialog id="day-report" aria-labelledby="day-report-title"></dialog>
    <dialog id="day-confirm" aria-labelledby="day-confirm-title"></dialog>
    <dialog id="reset-dialog">
      <div class="modal-head">
        <span class="eyebrow">A FRESH START</span
        ><button data-action="close-reset" aria-label="Close">×</button>
      </div>
      <h2>Start a new dealership?</h2>
      <p>
        Your current progress and transaction history will be lost. Start fresh
        with $5,000 and two empty garage spaces.
      </p>
      <div class="actions">
        <button data-action="close-reset">Cancel</button
        ><button class="danger" data-action="confirm-reset">
          Start new game
        </button>
      </div>
    </dialog>
  </body>
</html>
